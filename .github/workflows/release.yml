# GitHub actions workflow.
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax

name: Release

on:
  push:
    branches: [gh-actions]
    tags: [v*]

jobs:
  Linux:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest,    sys: x86_64 }
          - { os: ubuntu-26.04-arm, sys: arm64 }
    runs-on: ${{ matrix.os }}
    env:
      CC: gcc
      CFLAGS: -O2 -pipe -static -s
    steps:
    - run: sudo apt-get install -y libfl-dev
    - uses: actions/checkout@v7
    - run: make dist
    - name: Upload release tarball
      uses: actions/upload-artifact@v7
      with:
        path: pcalc-*.tar.*
        archive: false
    - run: make
    - run: mv pcalc pcalc-linux-${{matrix.sys}}
    - name: Upload prebuilt
      uses: actions/upload-artifact@v7
      with:
        path: pcalc-linux-${{matrix.sys}}
        archive: false

  macOS:
    strategy:
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CC: clang
      CFLAGS: -O2 -pipe -s
    steps:
    - run: brew install autoconf bison flex
    - uses: actions/checkout@v7
    - run: make
    - run: mv pcalc pcalc-macos-arm64
    - name: Upload prebuilt
      uses: actions/upload-artifact@v7
      with:
        path: pcalc-macos-arm64
        archive: false

  Windows:
    strategy:
      matrix:
        include:
          - { sys: mingw64, env: x86_64 }
          - { sys: mingw32, env: i686 }
          - { sys: ucrt64,  env: ucrt-x86_64 }
      fail-fast: false
    runs-on: windows-latest
    env:
      CC: gcc
      CFLAGS: -O2 -pipe -s
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: msys2/setup-msys2@v2
      with:
        update: true
        msystem: ${{matrix.sys}}
        install: >-
          autoconf
          bison
          flex
          make
          mingw-w64-${{matrix.env}}-gcc
    - uses: actions/checkout@v7
    - run: make
    - run: mv pcalc.exe pcalc-windows-${{matrix.sys}}.exe
    - name: Upload prebuilt
      uses: actions/upload-artifact@v7
      with:
        path: pcalc-windows-${{matrix.sys}}.exe
        archive: false
