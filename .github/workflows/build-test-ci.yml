# GitHub actions workflow.
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax

name: Build+Test CI

on:
  push:
    branches: [main, gh-actions]
    tags: [v*]
  pull_request:
    types: [opened]
    branches: [main]

jobs:
  Linux:
    strategy:
      matrix:
        os: [ubuntu-latest]
        cc: [gcc, clang]
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
    steps:
    - run: sudo apt-get install -y libfl-dev
    - uses: actions/checkout@v7
    - run: make distcheck

  macOS:
    strategy:
      matrix:
        os: [macos-latest]
        cc: [clang]
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
    steps:
    - run: brew install flex bison
    - uses: actions/checkout@v7
    - run: make
    - run: make check

  Windows:
    strategy:
      matrix:
        os: [windows-latest]
        cc: [mingw32, mingw64]
    runs-on: ${{ matrix.os }}
    env:
      CC: /c/msys64/${{ matrix.cc }}/bin/clang.exe
    defaults:
      run:
        shell: bash
    steps:
    - run: choco install winflexbison3
    - uses: actions/checkout@v7
    - run: make YACC="win_bison -ld" LEX="win_flex"
    # Needs autom4te (from autoconf) when building from git.
#    - run: make check
